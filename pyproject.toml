[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-zero"
version = "0.1.0"
description = "Evidence-based AI incident investigation with human-approved remediation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyyaml>=6", "docker>=7"]

[project.scripts]
incident-zero = "incident_zero.__main__:main"

[tool.setuptools.packages.find]
include = ["incident_zero*", "agent*"]
